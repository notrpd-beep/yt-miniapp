<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouTube Search</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { margin: 0; font-family: sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
  #bar { display: flex; gap: 8px; padding: 12px; position: sticky; top: 0; background: var(--tg-theme-bg-color, #fff); }
  #q { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #8888; font-size: 16px; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); font-size: 16px; }
  #player { display: none; padding: 0 12px; }
  #player iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 8px; }
  .item { display: flex; gap: 10px; padding: 10px 12px; cursor: pointer; }
  .item img { width: 140px; border-radius: 8px; }
  .item div { font-size: 14px; }
  #msg { padding: 12px; color: var(--tg-theme-hint-color, #888); }
</style>
</head>
<body>
<div id="bar">
  <input id="q" placeholder="ابحث في يوتيوب" />
  <button id="go">بحث</button>
</div>
<div id="player"></div>
<div id="msg"></div>
<div id="list"></div>

<script>
  const API_KEY = "YOUR_YOUTUBE_API_KEY";
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const q = document.getElementById("q");
  const list = document.getElementById("list");
  const msg = document.getElementById("msg");
  const player = document.getElementById("player");

  async function search() {
    const term = q.value.trim();
    if (!term) { msg.textContent = "اكتب شي للبحث"; return; }
    msg.textContent = "جاري البحث...";
    list.innerHTML = "";
    try {
      const url = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=15&q="
        + encodeURIComponent(term) + "&key=" + API_KEY;
      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok) { msg.textContent = "خطأ من يوتيوب: " + (data.error?.message || res.status); return; }
      msg.textContent = data.items.length ? "" : "ما كو نتائج";
      for (const it of data.items) {
        const div = document.createElement("div");
        div.className = "item";
        const img = document.createElement("img");
        img.src = it.snippet.thumbnails.medium.url;
        const title = document.createElement("div");
        title.textContent = it.snippet.title;
        div.append(img, title);
        div.onclick = () => play(it.id.videoId);
        list.appendChild(div);
      }
    } catch (e) {
      msg.textContent = "تعذر الاتصال، حاول مرة ثانية";
    }
  }

  function play(id) {
    player.style.display = "block";
    player.innerHTML = '<iframe src="https://www.youtube.com/embed/' + id +
      '?autoplay=1&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  document.getElementById("go").onclick = search;
  q.addEventListener("keydown", e => { if (e.key === "Enter") search(); });
</script>
</body>
</html>
